# Builds Snes9x RX from niuus/Snes9xRX's newest commit, once a day when there is
# one, and publishes it as a release with its own tag (nightly-<date>-<commit>),
# for RiftWii's app store (https://github.com/RiftWii/apps). A tag is never
# moved: the store pins each build by its checksum. Each release carries the
# exact source it was built from (GPL).
name: Nightly

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.upstream.outputs.sha }}
      tag: ${{ steps.upstream.outputs.tag }}
      build: ${{ steps.upstream.outputs.build }}
    steps:
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git ls-remote https://github.com/niuus/Snes9xRX.git refs/heads/master | cut -c1-40)
          test -n "$sha"
          short=${sha:0:7}
          last=$(gh release list -R "$GITHUB_REPOSITORY" -L 1 --json tagName -q '.[0].tagName' 2>/dev/null || true)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=nightly-$(date -u +%Y.%m.%d)-$short" >> "$GITHUB_OUTPUT"
          if [ "${last##*-}" = "$short" ]; then
            echo "Nothing new upstream since $last."
            echo "build=no" >> "$GITHUB_OUTPUT"
          else
            echo "build=yes" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'yes'
    runs-on: ubuntu-latest
    container: ghcr.io/extremscorner/libogc2:latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: niuus/Snes9xRX
          ref: ${{ needs.check.outputs.sha }}
          path: src
          submodules: recursive
      - name: Build
        run: |
          cd src
          export PATH="$DEVKITPRO/portlibs/ppc/bin:$DEVKITPPC/bin:$PATH"
          # The Makefile asks freetype-config, which the image may not have.
          if ! command -v freetype-config; then
            mkdir -p "$RUNNER_TEMP/bin"
            printf '#!/bin/sh\nexec powerpc-eabi-pkg-config freetype2 "$@"\n' > "$RUNNER_TEMP/bin/freetype-config"
            chmod +x "$RUNNER_TEMP/bin/freetype-config"
            export PATH="$RUNNER_TEMP/bin:$PATH"
          fi
          freetype-config --cflags
          # Snes9x RX reads Mini-XML 2's structures, which Mini-XML 3 hides:
          # 2.12 is built here, in place of the image's, for this build only.
          (cd "$RUNNER_TEMP" && curl -fsSL https://github.com/michaelrsweet/mxml/releases/download/v2.12/mxml-2.12.tar.gz | tar xz && cd mxml-2.12 &&
            ./configure --host=powerpc-eabi CC=powerpc-eabi-gcc AR=powerpc-eabi-ar RANLIB=powerpc-eabi-ranlib CFLAGS="-O2 -mrvl -mcpu=750 -meabi -mhard-float" --disable-threads --disable-shared --enable-static &&
            make libmxml.a && cp libmxml.a "$DEVKITPRO/portlibs/ppc/lib/" && cp mxml.h "$DEVKITPRO/portlibs/ppc/include/")
          # Its code reads <file>_size for each embedded file, which today's
          # bin2s no longer writes: a wrapper adds it where it is missing.
          mkdir -p "$RUNNER_TEMP/bin"
          cat > "$RUNNER_TEMP/bin/bin2s" <<'WRAP'
          #!/bin/sh
          out=$("$DEVKITPRO/tools/bin/bin2s" "$@") || exit $?
          printf '%s\n' "$out"
          skip=0
          for a in "$@"; do
            if [ $skip = 1 ]; then skip=0; continue; fi
            case "$a" in -a|-H) skip=1; continue;; -*) continue;; esac
            n=$(basename "$a" | sed 's/[^A-Za-z0-9_]/_/g')
            case "$out" in *"${n}_size"*) continue;; esac
            printf '\t.section .rodata\n\t.balign 4\n\t.global %s_size\n%s_size:\n\t.int %s\n' "$n" "$n" "$(wc -c < "$a")"
          done
          WRAP
          sed -i 's/^          //' "$RUNNER_TEMP/bin/bin2s"
          chmod +x "$RUNNER_TEMP/bin/bin2s"
          export PATH="$RUNNER_TEMP/bin:$PATH"
          make -f Makefile.wii -j2
      - name: Package
        run: |
          mkdir -p dist/apps/Snes9xRX
          cp src/hbc/* dist/apps/Snes9xRX/
          cp src/executables/snes9xrx-wii.dol dist/apps/Snes9xRX/boot.dol
      - uses: actions/upload-artifact@v4
        with:
          name: app
          path: dist/

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: app
          path: dist
      - uses: actions/checkout@v4
        with:
          repository: niuus/Snes9xRX
          ref: ${{ needs.check.outputs.sha }}
          path: source
          submodules: recursive
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          SHA: ${{ needs.check.outputs.sha }}
        run: |
          (cd dist && zip -qr "../Snes9xRX-nightly-$TAG.zip" apps)
          rm -rf source/.git
          tar -czf "source-$TAG.tar.gz" source
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --prerelease --title "$TAG" \
            --notes "Snes9x RX built from https://github.com/niuus/Snes9xRX/commit/$SHA (its source is attached). Not an official release: a daily build for RiftWii's app store." \
            "Snes9xRX-nightly-$TAG.zip" "source-$TAG.tar.gz"
      - name: Keep the newest 10 builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list -R "$GITHUB_REPOSITORY" -L 100 --json tagName -q '.[].tagName' | tail -n +11 |
            while read -r old; do gh release delete "$old" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
